name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Cancel in-progress runs for the same PR so each push only keeps the latest preview
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Write access to push to gh-pages branch; write access to comment on the PR
permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Lint
        if: github.event.action != 'closed'
        run: npm run lint

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build -- --base=/tomas-fontanarrosa-cv/pr-preview/pr-${{ github.event.pull_request.number }}/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: ./dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
